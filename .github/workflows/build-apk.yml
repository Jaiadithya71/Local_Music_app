name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Execution failed|SDK" -A2 /tmp/build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3000 | while read -r l; do echo "::error::$l"; done
            grep -E "^e: " /tmp/build.log | head -30 | while read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: vibestream-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VibeStream-debug.apk
          gh release delete v1.0.1 --yes --cleanup-tag || true
          gh release create v1.0.1 VibeStream-debug.apk --target "$GITHUB_SHA" --title "v1.0.1 debug (fixes compiled)" --notes "Debug APK built by CI from the commit with the service playback and verified download fixes. Personal sideload only."
