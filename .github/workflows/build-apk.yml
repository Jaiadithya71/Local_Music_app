name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Execution failed|SDK" -A2 /tmp/build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3000 | while read -r l; do echo "::error::$l"; done
            grep -E "^e: " /tmp/build.log | head -30 | while read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: vibestream-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
