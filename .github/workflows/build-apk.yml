name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
# Serialise runs: parallel builds race on deleting/creating the same v1.0.1
# release and lose with HTTP 403. Queued, each push still gets its own run.
concurrency:
  group: build-apk-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibestream.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/vibestream.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Execution failed|SDK" -A2 /tmp/build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3000 | while read -r l; do echo "::error::$l"; done
            grep -E "^e: " /tmp/build.log | head -30 | while read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - name: Verify APK signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          echo "Expected keystore cert:"
          keytool -list -v -keystore "$RUNNER_TEMP/vibestream.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null | grep -i 'SHA256:' || true
      - uses: actions/upload-artifact@v4
        with:
          name: vibestream-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VibeStream-debug.apk
          gh release delete v1.0.1 --yes --cleanup-tag || true
          for attempt in 1 2 3; do
            if gh release create v1.0.1 VibeStream-debug.apk --target "$GITHUB_SHA" --title "v1.0.1 debug (fixes compiled)" --notes "Debug APK built by CI. Personal sideload only."; then
              break
            fi
            echo "release create attempt $attempt failed; retrying in 20s"
            sleep 20
            gh release delete v1.0.1 --yes --cleanup-tag || true
          done
          gh release view v1.0.1 --json tagName --jq .tagName
