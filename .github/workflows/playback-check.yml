name: Playback regression
on:
  push:
    branches: [verification/audio-quality, verification/discovery-fix, verification/queue-reconnect, verification/song-radio-cache]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Logic regression
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*QueueReconnectTest' --tests '*MixBuilderTest' --tests '*PersistenceTest' --tests '*MusicSearchPolicyTest' --tests '*DiscoveryPolicyTest' --tests '*DiscoveryPersistenceTest' --tests '*DiscoveryHomeTest' --tests '*SongSeedPolicyTest' --tests '*RelatedSongCacheTest' --tests '*PlaybackCacheTest' --tests '*SlowRadioHomeTest' --tests '*BackupImportSeedsTest'
      - name: Collect actual Home render
        run: |
          mkdir -p playback-evidence
          cp ~/renders/discovery-home.png playback-evidence/
      - name: Android playback with generated PCM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/playback-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-regression-evidence
          retention-days: 1
          path: |
            /home/runner/renders/
            playback-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/testDebugUnitTest/
